[project]
name = "it-agent"
version = "0.1.0"
description = "企业级智能 IT 服务台 Agent - 工程初始化"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0,<2.0",
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "fastapi>=0.162.0,<0.163",
    "uvicorn[standard]>=0.54.0,<0.55",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/it_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-q"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N"]

[tool.ruff.lint.isort]
known-first-party = ["it_agent"]
